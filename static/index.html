<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DataMind · 企业级数据分析 Agent</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f7fa;
    color: #1f2328;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: linear-gradient(135deg, #1e3a8a, #1e40af);
    color: #fff;
    padding: 14px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  header h1 { font-size: 18px; font-weight: 600; }
  header .user-input { display: flex; align-items: center; gap: 8px; }
  header input {
    padding: 6px 12px;
    border: 1px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.1);
    color: #fff;
    border-radius: 6px;
    font-size: 13px;
    width: 180px;
    outline: none;
  }
  header input::placeholder { color: rgba(255,255,255,0.6); }

  main { flex: 1; display: flex; overflow: hidden; }

  .chat-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: #fff;
    border-right: 1px solid #e5e7eb;
    min-width: 0;
  }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    background: #fafbfc;
  }
  .msg { margin-bottom: 16px; }
  .msg.user { display: flex; justify-content: flex-end; }
  .msg.user .bubble {
    background: #1e40af;
    color: #fff;
    border-radius: 12px 12px 3px 12px;
    padding: 10px 14px;
    max-width: 70%;
    font-size: 14px;
    line-height: 1.5;
  }
  .msg.assistant .bubble {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 12px 12px 12px 3px;
    padding: 12px 16px;
    max-width: 85%;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.assistant .bubble.error { background: #fef2f2; border-color: #fecaca; color: #991b1b; }

  .sql-block {
    background: #f8fafc;
    border-left: 3px solid #1e40af;
    padding: 10px 14px;
    margin-top: 10px;
    font-family: "Consolas", "Monaco", monospace;
    font-size: 12px;
    line-height: 1.5;
    color: #334155;
    border-radius: 4px;
    overflow-x: auto;
    white-space: pre;
  }
  .result-table {
    margin-top: 10px;
    border-collapse: collapse;
    width: 100%;
    font-size: 13px;
  }
  .result-table th, .result-table td {
    border: 1px solid #e5e7eb;
    padding: 6px 10px;
    text-align: left;
  }
  .result-table th { background: #f1f5f9; font-weight: 600; }

  .hitl-panel {
    background: #fffbeb;
    border: 1px solid #fde68a;
    border-radius: 8px;
    padding: 12px 16px;
    margin-top: 10px;
  }
  .hitl-panel h4 { font-size: 13px; color: #92400e; margin-bottom: 8px; }
  .hitl-panel .btn-row { display: flex; gap: 8px; margin-top: 10px; }
  .hitl-panel button {
    padding: 6px 16px;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 500;
  }
  .btn-approve { background: #16a34a; color: #fff; }
  .btn-reject  { background: #dc2626; color: #fff; }

  .input-area {
    padding: 12px 20px;
    border-top: 1px solid #e5e7eb;
    display: flex;
    gap: 10px;
    background: #fff;
  }
  .input-area input {
    flex: 1;
    padding: 11px 16px;
    border: 1px solid #d0d7de;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
  }
  .input-area input:focus { border-color: #1e40af; }
  .input-area button {
    padding: 11px 24px;
    background: #1e40af;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
  .input-area button:disabled { background: #94a3b8; cursor: not-allowed; }

  .right-panel {
    width: 380px;
    min-width: 320px;
    display: flex;
    flex-direction: column;
    background: #fff;
    overflow-y: auto;
  }
  .right-panel .section {
    padding: 16px 20px;
    border-bottom: 1px solid #f0f0f0;
  }
  .right-panel h3 {
    font-size: 14px;
    color: #334155;
    margin-bottom: 10px;
    font-weight: 600;
  }
  #chart {
    width: 100%;
    height: 260px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .empty-hint { color: #94a3b8; font-size: 13px; text-align: center; padding: 20px; }

  .examples {
    padding: 8px 20px 12px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    background: #fff;
  }
  .examples button {
    padding: 5px 12px;
    font-size: 12px;
    background: #f1f5f9;
    color: #475569;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    cursor: pointer;
  }
  .examples button:hover { background: #e0e7ff; color: #1e40af; border-color: #c7d2fe; }
</style>
</head>
<body>
  <header>
    <h1>🤖 DataMind · 企业级数据分析 Agent</h1>
    <div class="user-input">
      <input id="userId" type="text" placeholder="用户ID" value="analyst_001" />
    </div>
  </header>

  <main>
    <div class="chat-panel">
      <div class="messages" id="messages">
        <div class="msg assistant">
          <div class="bubble">您好~ 我是 DataMind 数据分析助手，可以帮您查询销售、订单、商品、区域等业务数据。请问您想了解什么？</div>
        </div>
      </div>
      <div class="examples">
        <button onclick="quickAsk('华东区的销售额是多少？')">华东区的销售额</button>
        <button onclick="quickAsk('每个区域的已完成订单金额？')">各区域销售额</button>
        <button onclick="quickAsk('销量最高的商品是什么？')">销量最高商品</button>
        <button onclick="quickAsk('员工工资明细')">员工工资（触发HITL）</button>
      </div>
      <div class="input-area">
        <input id="input" type="text" placeholder="请输入您的问题..." autocomplete="off" />
        <button id="sendBtn" onclick="send()">发送</button>
      </div>
    </div>

    <div class="right-panel">
      <div class="section">
        <h3>📊 数据可视化</h3>
        <div id="chart">
          <div class="empty-hint">查询结果将自动生成图表</div>
        </div>
      </div>
      <div class="section">
        <h3>🔍 最近查询溯源</h3>
        <div id="provenance" class="empty-hint">暂无查询</div>
      </div>
    </div>
  </main>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
let sending = false;
let chart = null;

function addMessage(role, content) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = content;
  div.appendChild(bubble);
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return bubble;
}

function quickAsk(text) { inputEl.value = text; send(); }

async function send() {
  const text = inputEl.value.trim();
  if (!text || sending) return;

  const userId = document.getElementById('userId').value.trim() || 'anonymous';
  sending = true;
  sendBtn.disabled = true;
  sendBtn.textContent = '...';
  inputEl.value = '';

  addMessage('user', text);
  const bubble = addMessage('assistant', '⏳ 正在处理...');

  try {
    const resp = await fetch('/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: text, user_id: userId })
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    renderResponse(bubble, data);
  } catch (e) {
    bubble.textContent = '抱歉，服务异常：' + e.message;
    bubble.classList.add('error');
  } finally {
    sending = false;
    sendBtn.disabled = false;
    sendBtn.textContent = '发送';
    inputEl.focus();
  }
}

function renderResponse(bubble, data) {
  bubble.innerHTML = '';

  const answerDiv = document.createElement('div');
  answerDiv.textContent = data.answer || (data.error ? '查询失败：' + data.error : '（无回答）');
  bubble.appendChild(answerDiv);
  if (data.error) bubble.classList.add('error');

  if (data.sql) {
    const sqlDiv = document.createElement('div');
    sqlDiv.className = 'sql-block';
    sqlDiv.textContent = data.sql;
    bubble.appendChild(sqlDiv);
  }

  if (data.rows && data.rows.length > 0) {
    renderTable(bubble, data.rows);
    renderChart(data.rows, data.sql);
    renderProvenance(data);
  } else {
    document.getElementById('chart').innerHTML = '<div class="empty-hint">无数据</div>';
  }

  if (data.interrupted) {
    renderHitlPanel(bubble, data);
  }

  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function renderTable(container, rows) {
  if (!rows || rows.length === 0) return;
  const headers = Object.keys(rows[0]);
  const table = document.createElement('table');
  table.className = 'result-table';

  const thead = document.createElement('thead');
  const tr = document.createElement('tr');
  headers.forEach(h => {
    const th = document.createElement('th');
    th.textContent = h;
    tr.appendChild(th);
  });
  thead.appendChild(tr);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  rows.slice(0, 20).forEach(row => {
    const tr = document.createElement('tr');
    headers.forEach(h => {
      const td = document.createElement('td');
      td.textContent = row[h] !== null && row[h] !== undefined ? row[h] : '';
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  container.appendChild(table);
}

function renderChart(rows, sql) {
  const chartEl = document.getElementById('chart');
  if (!rows || rows.length === 0) {
    chartEl.innerHTML = '<div class="empty-hint">无数据</div>';
    if (chart) { chart.dispose(); chart = null; }
    return;
  }

  chartEl.innerHTML = '';
  if (chart) chart.dispose();
  chart = echarts.init(chartEl);

  const headers = Object.keys(rows[0]);

  // 单值 → 大数字
  if (rows.length === 1 && headers.length === 1) {
    const val = rows[0][headers[0]];
    const display = typeof val === 'number'
      ? val.toLocaleString('zh-CN')
      : String(val);
    chart.setOption({
      title: [
        { text: headers[0], left: 'center', top: '25%',
          textStyle: { fontSize: 14, color: '#64748b', fontWeight: 'normal' } },
        { text: display, left: 'center', top: '42%',
          textStyle: { fontSize: 32, color: '#1e40af', fontWeight: 'bold' } }
      ]
    });
    return;
  }

  let xField = null, yField = null;
  for (const h of headers) {
    const v = rows[0][h];
    if (typeof v === 'string' && !xField) xField = h;
    else if (typeof v === 'number' && !yField) yField = h;
  }
  if (!xField) xField = headers[0];
  if (!yField) yField = headers[1] || headers[0];

  const xData = rows.map(r => String(r[xField]));
  const yData = rows.map(r => Number(r[yField]) || 0);
  const isLine = /month|日期|date/i.test(sql || '') || xData.length > 6;

  chart.setOption({
    tooltip: { trigger: 'axis' },
    grid: { left: 50, right: 20, top: 30, bottom: 60 },
    xAxis: { type: 'category', data: xData, axisLabel: { rotate: 30, fontSize: 11 } },
    yAxis: { type: 'value' },
    series: [{
      name: yField,
      data: yData,
      type: isLine ? 'line' : 'bar',
      smooth: true,
      itemStyle: { color: '#1e40af' },
      areaStyle: isLine ? { opacity: 0.15 } : undefined,
    }]
  });
}

function renderProvenance(data) {
  const el = document.getElementById('provenance');
  if (!data.sql) {
    el.innerHTML = '<div class="empty-hint">非查询意图，无溯源</div>';
    return;
  }

  const riskColor = data.risk === 'high' ? '#dc2626' : '#16a34a';
  const sqlPreview = data.sql ? data.sql.substring(0, 200) + (data.sql.length > 200 ? '...' : '') : '';

  el.innerHTML = `
    <div style="font-size:12px; line-height:1.8;">
      <div><b>风险等级：</b><span style="color:${riskColor}">${data.risk || 'unknown'}</span></div>
      <div><b>返回行数：</b>${data.rows ? data.rows.length : 0}</div>
      <div style="margin-top:8px;"><b>SQL 摘要：</b></div>
      <div style="background:#f8fafc;padding:6px;border-radius:4px;font-family:monospace;font-size:11px;overflow-x:auto;word-break:break-all;">
        ${sqlPreview}
      </div>
    </div>
  `;
}

function renderHitlPanel(container, data) {
  const panel = document.createElement('div');
  panel.className = 'hitl-panel';
  panel.innerHTML = `
    <h4>⏸️ 该 SQL 已挂起，等待人工审批</h4>
    <div style="font-size:12px;color:#78350f;">风险原因：${data.interrupt_info?.risk_reason || '未知'}</div>
    <div class="btn-row">
      <button class="btn-approve" onclick="approve('${data.thread_id}', true)">✅ 批准执行</button>
      <button class="btn-reject" onclick="approve('${data.thread_id}', false)">🚫 拒绝</button>
    </div>
  `;
  container.appendChild(panel);
}

async function approve(threadId, approved) {
  const reason = approved ? '' : (prompt('拒绝原因：') || '管理员拒绝');
  try {
    const resp = await fetch('/api/approve', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ thread_id: threadId, approved, reason })
    });
    const data = await resp.json();
    const bubble = addMessage('assistant', '');
    renderResponse(bubble, data);
  } catch (e) {
    alert('审批失败：' + e.message);
  }
}

inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

inputEl.focus();
</script>
</body>
</html>
